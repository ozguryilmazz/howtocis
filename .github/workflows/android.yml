name: Android APK

# main dalına her gönderimde test APK'sı (debug) derlenir ve "Artifacts" olarak saklanır.
# v1.2.3 gibi bir etiket gönderilince imzalı sürüm APK'sı derlenir ve GitHub Releases'a yüklenir.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot önbelleği
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot ve dışa aktarma şablonlarını kur
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-cache && cd ~/godot-cache
          [ -f godot.zip ] || curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -o -q godot.zip -d ~/godot-bin
          sudo ln -sf ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL" /tmp/tpl
          unzip -o -q templates.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$TPL/"
          godot --version

      - name: Android SDK yolunu Godot'ya tanıt
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > ~/.config/godot/$f
          done

      - name: Sürüm numarası
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"; KIND=release
          else
            V="0.0.${GITHUB_RUN_NUMBER}"; KIND=debug
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          sed -i "s/^version\/name=.*/version\/name=\"$V\"/; s/^version\/code=.*/version\/code=$CODE/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Sürüm $V (kod $CODE, $KIND)"

      - name: Firebase ayarı
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Repodaki config/firebase.json doluysa olduğu gibi kullanılır.
          # Boşsa ve secret tanımlıysa, derleme sırasında secret'tan doldurulur.
          if [ -n "${FIREBASE_API_KEY:-}" ] && grep -q '"api_key": ""' config/firebase.json; then
            printf '{\n  "api_key": "%s",\n  "project_id": "%s"\n}\n' "$FIREBASE_API_KEY" "$FIREBASE_PROJECT_ID" > config/firebase.json
          fi

      - name: İmza anahtarı
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ "${{ steps.ver.outputs.kind }}" = "release" ]; then
            if [ -z "${KEYSTORE_B64:-}" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret'ı yok. tools/imza-kur.ps1 betiğini çalıştırın."
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            {
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Projeyi içe aktar
        run: godot --headless --import

      - name: APK derle
        run: |
          set -euo pipefail
          mkdir -p build
          if [ "${{ steps.ver.outputs.kind }}" = "release" ]; then
            godot --headless --export-release "Android" build/howtocis.apk
          else
            godot --headless --export-debug "Android" build/howtocis.apk
          fi
          test -s build/howtocis.apk || { echo "::error::APK oluşmadı"; exit 1; }
          ls -lh build/

      - name: Test APK'sını sakla
        uses: actions/upload-artifact@v4
        with:
          name: howtocis-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.kind }}
          path: build/howtocis.apk
          retention-days: 14

      - name: GitHub Release oluştur
        if: steps.ver.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          cp build/howtocis.apk "build/howtocis-$V.apk"
          gh release create "$GITHUB_REF_NAME" build/howtocis.apk "build/howtocis-$V.apk" \
            --title "HOW TO ÇİŞ $V" \
            --notes "Telefona kurmak için howtocis.apk dosyasını indirin." \
            --latest
